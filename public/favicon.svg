<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Deep ocean background -->
  <circle cx="100" cy="100" r="95" fill="#0a2540"/>
  
  <!-- Sunset gradient -->
  <defs>
    <linearGradient id="sunGradient" x1="100" y1="60" x2="100" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
  </defs>
  
  <!-- Sun -->
  <circle cx="100" cy="75" r="28" fill="url(#sunGradient)"/>
  
  <!-- Ocean waves -->
  <path d="M40 130 Q55 115 70 130 Q85 145 100 130 Q115 115 130 130 Q145 145 160 130" 
        stroke="#00b4d8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M30 155 Q50 140 70 155 Q90 170 110 155 Q130 140 150 155" 
        stroke="#00b4d8" stroke-width="10" stroke-linecap="round" fill="none"/>
  
  <!-- Ship wheel -->
  <circle cx="100" cy="100" r="45" stroke="#ffffff" stroke-width="8" fill="none"/>
  <circle cx="100" cy="100" r="22" fill="#0a2540"/>
  
  <!-- Wheel spokes -->
  <line x1="100" y1="60" x2="100" y2="80" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="120" x2="100" y2="140" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="65" y1="100" x2="85" y2="100" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="115" y1="100" x2="135" y2="100" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Diagonal spokes -->
  <line x1="72" y1="72" x2="88" y2="88" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="112" y1="112" x2="128" y2="128" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="128" x2="88" y2="112" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="112" y1="72" x2="128" y2="88" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
</svg>